name: Résumé du matin

# Lancé chaque jour à 8h00 (heure de Paris) par cron-job.org, via l'API GitHub
# (les tâches programmées de GitHub arrivaient avec plusieurs heures de retard).
# Le bouton « Run workflow » de l'onglet Actions permet aussi de tester à tout moment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer web-push
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7

      - name: Envoyer le réveil au téléphone
        run: node scripts/send-push.mjs
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
